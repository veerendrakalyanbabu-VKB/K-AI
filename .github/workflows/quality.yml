name: Quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app
      - run: node --check app/static/app.js
      - run: node --check app/static/sky.js
      - run: node -e "const {lookAngles}=require('./app/static/sky.js'); const a=lookAngles({lat:0,lng:0},{lat:0,lng:1,alt_m:0}); if(Math.abs(a.azimuth-90)>0.01) process.exit(1)"
      - run: node --test tests/controls.test.cjs
